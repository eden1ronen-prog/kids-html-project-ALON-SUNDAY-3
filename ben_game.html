<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Voxiom 2D IO - Created by Rom303</title>
    <style>
        body {
            background-color: #1e1e24;
            color: white;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin: 10px 0 5px 0;
            font-size: 28px;
        }
        #gameContainer {
            position: relative;
            display: inline-block;
        }
        canvas {
            background-color: #2e3f33; /* צבע דשא כהה */
            border: 4px solid #4a614c;
            border-radius: 8px;
            cursor: crosshair;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin: 5px auto;
            font-size: 20px;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .info-box { font-weight: bold; }
        .weapon-active { color: #ffeb3b; }
    </style>
</head>
<body>

    <h1>Voxiom & Rivals .IO स्टाइल</h1>
    
    <div id="ui">
        <div class="info-box" style="color: #ff4d4d;">חיים: <span id="hp">100</span></div>
        <div class="info-box">נשק: <span id="weaponDisplay" class="weapon-active">סנייפר 🎯</span></div>
        <div class="info-box" style="color: #4da6ff;">ניקוד: <span id="score">0</span></div>
    </div>

    <div id="gameContainer">
        <canvas id="ioCanvas" width="800" height="550"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('ioCanvas');
        const ctx = canvas.getContext('2d');

        // הגדרות בסיסיות
        const keys = {};
        const mouse = { x: 0, y: 0 };
        
        const player = { x: 400, y: 275, size: 20, speed: 4, hp: 100, score: 0, weapon: 'sniper' };
        const enemies = [];
        const bullets = [];
        let slashEffect = { active: false, timer: 0, angle: 0 };
        let lastAttackTime = 0;

        // הקשבה למקלדת ועכבר
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.key === '1') { player.weapon = 'sniper'; document.getElementById('weaponDisplay').innerText = 'סנייפר 🎯'; }
            if (e.key === '2') { player.weapon = 'katana'; document.getElementById('weaponDisplay').innerText = 'קאטאנה ⚔️'; }
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => {
            let now = Date.now();
            if (player.weapon === 'sniper' && now - lastAttackTime > 600) {
                // ירי בסנייפר
                let angle = Math.getAngle();
                bullets.push({
                    x: player.x,
                    y: player.y,
                    vx: Math.cos(angle) * 15,
                    vy: Math.sin(angle) * 15
                });
                lastAttackTime = now;
            } 
            else if (player.weapon === 'katana' && now - lastAttackTime > 300) {
                // התקפת קאטאנה
                let angle = Math.getAngle();
                slashEffect.active = true;
                slashEffect.timer = 10;
                slashEffect.angle = angle;

                // בדיקה אם פגענו באויב קרוב
                for (let i = enemies.length - 1; i >= 0; i--) {
                    let dist = Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y);
                    if (dist < 75) { // טווח החרב
                        enemies.splice(i, 1);
                        player.score += 10;
                        document.getElementById('score').innerText = player.score;
                    }
                }
                lastAttackTime = now;
            }
        });

        // פונקציית עזר לחישוב זווית השחקן אל מול העכבר
        Math.getAngle = function() {
            return Math.atan2(mouse.y - player.y, mouse.x - player.x);
        };

        // יצירת אויבים אוטומטית
        setInterval(() => {
            if (player.hp <= 0) return;
            // מוליד אויב באחד מקצוות המסך באופן אקראי
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? 0 : canvas.width;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? 0 : canvas.height;
            }
            enemies.push({ x: x, y: y, size: 16, speed: 1.8 });
        }, 1200);

        function update() {
            if (player.hp <= 0) return;

            // תנועת שחקן (WASD או חיצים)
            if (keys['KeyW'] || keys['ArrowUp']) player.y -= player.speed;
            if (keys['KeyS'] || keys['ArrowDown']) player.y += player.speed;
            if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speed;
            if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speed;

            // הגבלת השחקן לגבולות המסך
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

            // עדכון כדורי סנייפר
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                // מחיקה אם יצא מהמסך
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // בדיקת פגיעה באויב
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let dist = Math.hypot(enemies[j].x - b.x, enemies[j].y - b.y);
                    if (dist < enemies[j].size) {
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        player.score += 10;
                        document.getElementById('score').innerText = player.score;
                        break;
                    }
                }
            }

            // עדכון תנועת אויבים אליך
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                let angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angleToPlayer) * e.speed;
                e.y += Math.sin(angleToPlayer) * e.speed;

                // נזק לשחקן אם אויב נוגע בו
                let dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < player.size + e.size) {
                    player.hp -= 0.5; // מוריד חיים בהדרגה
                    document.getElementById('hp').innerText = Math.max(0, Math.floor(player.hp));
                    if (player.hp <= 0) {
                        player.hp = 0;
                    }
                }
            }

            // טיימר אפקט חרב
            if (slashEffect.active) {
                slashEffect.timer--;
                if (slashEffect.timer <= 0) slashEffect.active = false;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ציור קווי רשת (גריד של קוביות כמו ווקסיום)
            ctx.strokeStyle = '#374b3c';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let j=0; j<canvas.height; j+=40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            if (player.hp <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff4d4d';
                ctx.font = 'bold 45px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('המשחק נגמר!', canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = 'white';
                ctx.font = '24px Arial';
                ctx.fillText('הניקוד שלך: ' + player.score, canvas.width / 2, canvas.height / 2 + 30);
                ctx.font = '18px Arial';
                ctx.fillText('רענן את הדף (F5) כדי לנסות שוב', canvas.width / 2, canvas.height / 2 + 70);
                return;
            }

            // ציור כדורים
            ctx.fillStyle = '#ffeb3b';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // ציור אפקט קאטאנה (הנפת החרב)
            if (slashEffect.active) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(player.x, player.y, 50, slashEffect.angle - 0.8, slashEffect.angle + 0.8);
                ctx.stroke();
            }

            // ציור אויבים (ריבועים אדומים כמו זומבים מרובעים)
            ctx.fillStyle = '#dc3545';
            enemies.forEach(e => {
                ctx.fillRect(e.x - e.size/2, e.y - e.size/2, e.size, e.size);
                // עיניים קטנות
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x - 5, e.y - 4, 3, 3);
                ctx.fillRect(e.x + 2, e.y - 4, 3, 3);
                ctx.fillStyle = '#dc3545';
            });

            // ציור השחקן (עיגול כחול עם כיוון נשק)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(Math.getAngle());

            // גוף השחקן
            ctx.fillStyle = '#007bff';
            ctx.beginPath();
            ctx.arc(0, 0, player.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#0056b3';
            ctx.stroke();

            // ציור הנשק ביד
            ctx.fillStyle = player.weapon === 'sniper' ? '#555' : '#e0e0e0';
            if (player.weapon === 'sniper') {
                // קנה של רובה ארוך
                ctx.fillRect(15, -4, 25, 8);
            } else {
                // להב של קאטאנה
                ctx.fillRect(10, -2, 30, 4);
            }
            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
