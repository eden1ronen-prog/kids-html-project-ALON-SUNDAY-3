<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק פרקור נינג׳ה תלת מימד</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87dfff;
    }

    #ui {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 10;
      color: white;
      font-size: 22px;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 18px;
      border-radius: 15px;
      line-height: 1.7;
    }

    #help {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 10;
      direction: ltr;
      color: white;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.45);
      padding: 10px 14px;
      border-radius: 12px;
    }

    #message {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      color: white;
      font-size: 34px;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="ui">
    ❤️ חיים: <span id="lives">3</span><br>
    ⭐ ניקוד: <span id="score">0</span><br>
    🏁 שלב: <span id="level">1</span>/5
  </div>

  <div id="help">Arrows / WASD = Move | Space = Jump | R = Restart</div>
  <div id="message"></div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    let scene, camera, renderer;
    let player;
    let platforms = [];
    let coins = [];
    let keys = {};

    let lives = 3;
    let score = 0;
    let level = 1;
    let velocityY = 0;
    let onGround = false;
    let gameOver = false;

    const startPosition = new THREE.Vector3(0, 2, 0);
    const gravity = -0.022;
    const jumpPower = 0.45;
    const speed = 0.15;

    startGame();

    function startGame() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87dfff);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 8);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const sun = new THREE.DirectionalLight(0xffffff, 1.2);
      sun.position.set(5, 10, 7);
      sun.castShadow = true;
      scene.add(sun);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));

      createPlayer();
      buildLevel();
      addEvents();
      animate();
    }

    function createPlayer() {
      player = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0x111111 })
      );
      body.castShadow = true;
      player.add(body);

      const ninja = makeEmojiSprite("🥷", 1.35);
      ninja.position.set(0, 0.08, 0.1);
      player.add(ninja);

      player.position.copy(startPosition);
      scene.add(player);
    }

    function makeEmojiSprite(emoji, size) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, 256, 256);
      ctx.font = "170px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(emoji, 128, 135);

      const texture = new THREE.CanvasTexture(canvas);
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(size, size, size);
      return sprite;
    }

    function buildLevel() {
      clearLevel();
      hideMessage();
      updateUI();

      player.position.copy(startPosition);
      velocityY = 0;
      onGround = false;

      let x = 0;
      let z = 0;
      const amount = 7 + level;

      for (let i = 0; i < amount; i++) {
        const isFinish = i === amount - 1;
        const width = Math.max(2.7, 3.8 - level * 0.16);
        const depth = Math.max(2.4, 3.1 - level * 0.10);

        if (i > 0) {
          z -= 4.4;
          x += (Math.random() - 0.5) * 1.8;
          x = Math.max(-4.5, Math.min(4.5, x));
        }

        const platform = new THREE.Mesh(
          new THREE.BoxGeometry(width, 0.45, depth),
          new THREE.MeshStandardMaterial({ color: isFinish ? 0x00bb66 : 0x7c4dff })
        );
        platform.position.set(x, 0, z);
        platform.receiveShadow = true;
        platform.userData.isFinish = isFinish;
        scene.add(platform);
        platforms.push(platform);

        if (isFinish) {
          const flag = makeEmojiSprite("🏁", 1.3);
          flag.position.set(x, 1.25, z);
          scene.add(flag);
          platforms.push(flag);
        } else if (i > 0) {
          const coin = makeEmojiSprite("⭐", 0.9);
          coin.position.set(x, 1.2, z);
          coin.userData.collected = false;
          scene.add(coin);
          coins.push(coin);
        }
      }
    }

    function clearLevel() {
      for (const p of platforms) scene.remove(p);
      for (const c of coins) scene.remove(c);
      platforms = [];
      coins = [];
    }

    function addEvents() {
      window.addEventListener("keydown", function(e) {
        keys[e.key.toLowerCase()] = true;
        if (e.code === "Space") keys.space = true;
        if (e.key.toLowerCase() === "r") restart();
      });

      window.addEventListener("keyup", function(e) {
        keys[e.key.toLowerCase()] = false;
        if (e.code === "Space") keys.space = false;
      });

      window.addEventListener("resize", function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!gameOver) update();
      renderer.render(scene, camera);
    }

    function update() {
      let dx = 0;
      let dz = 0;

      // שליטה ידנית בלבד — אין ריצה אוטומטית
      if (keys.w || keys.arrowup) dz -= speed;
      if (keys.s || keys.arrowdown) dz += speed;
      if (keys.a || keys.arrowleft) dx -= speed;
      if (keys.d || keys.arrowright) dx += speed;

      player.position.x += dx;
      player.position.z += dz;

      if (dx !== 0 || dz !== 0) player.rotation.y += 0.08;

      if (keys.space && onGround) {
        velocityY = jumpPower;
        onGround = false;
      }

      velocityY += gravity;
      player.position.y += velocityY;

      checkPlatforms();
      checkCoins();
      checkFalling();
      moveCamera();
    }

    function checkPlatforms() {
      onGround = false;

      for (const p of platforms) {
        if (!p.geometry) continue;

        const box = new THREE.Box3().setFromObject(p);
        const px = player.position.x;
        const py = player.position.y - 0.5;
        const pz = player.position.z;

        const insideX = px >= box.min.x && px <= box.max.x;
        const insideZ = pz >= box.min.z && pz <= box.max.z;
        const touchingTop = py <= box.max.y + 0.12 && py >= box.max.y - 0.35;

        if (insideX && insideZ && touchingTop && velocityY <= 0) {
          player.position.y = box.max.y + 0.5;
          velocityY = 0;
          onGround = true;

          if (p.userData.isFinish) {
            goNextLevel();
          }
        }
      }
    }

    function checkCoins() {
      for (const coin of coins) {
        coin.rotation.y += 0.06;

        if (!coin.userData.collected && player.position.distanceTo(coin.position) < 0.85) {
          coin.userData.collected = true;
          scene.remove(coin);
          score += 10;
          updateUI();
        }
      }
    }

    function checkFalling() {
      if (player.position.y < -6) {
        lives--;
        updateUI();

        if (lives <= 0) {
          finishGame(false);
        } else {
          player.position.copy(startPosition);
          velocityY = 0;
        }
      }
    }

    function goNextLevel() {
      if (level === 5) {
        score += 100;
        updateUI();
        finishGame(true);
        return;
      }

      score += 50;
      level++;
      buildLevel();
    }

    function moveCamera() {
      camera.position.x += (player.position.x - camera.position.x) * 0.08;
      camera.position.y += (player.position.y + 4.2 - camera.position.y) * 0.08;
      camera.position.z += (player.position.z + 8 - camera.position.z) * 0.08;
      camera.lookAt(player.position.x, player.position.y, player.position.z - 3);
    }

    function finishGame(won) {
      gameOver = true;
      showMessage(
        won
          ? "🎉 ניצחת בכל 5 השלבים!<br>ניקוד: " + score + "<br><small>לחץ R להתחלה מחדש</small>"
          : "💀 נגמרו החיים!<br>ניקוד: " + score + "<br><small>לחץ R להתחלה מחדש</small>"
      );
    }

    function restart() {
      lives = 3;
      score = 0;
      level = 1;
      gameOver = false;
      buildLevel();
      updateUI();
    }

    function updateUI() {
      document.getElementById("lives").textContent = lives;
      document.getElementById("score").textContent = score;
      document.getElementById("level").textContent = level;
    }

    function showMessage(text) {
      const msg = document.getElementById("message");
      msg.innerHTML = text;
      msg.style.display = "flex";
    }

    function hideMessage() {
      document.getElementById("message").style.display = "none";
    }
  </script>
</body>
</html>
